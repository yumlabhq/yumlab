version: 2

project_name: yumlab

before:
  hooks:
    - go mod tidy

builds:
  - id: yumlab
    main: ./cmd/yumlab
    binary: yumlab
    # A single static binary, so Yumlab runs in any CI container.
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - .yumlab.example.yaml
      - docs/**/*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  footer: |
    ## Install

    ```
    go install github.com/yumlabhq/yumlab/cmd/yumlab@{{ .Tag }}
    ```

    Or download a binary below. Verify it against `checksums.txt`.

# Homebrew and the ghcr.io image are v0.5 in the roadmap. Both need
# infrastructure this release does not have: a homebrew-tap repository plus a
# token that can push to it, and per-architecture docker entries combined by a
# docker_manifests block. Everything above is covered by the built-in
# GITHUB_TOKEN alone.
